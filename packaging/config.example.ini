# Lumen configuration.
#
# Every value below is the built-in default, so you can delete anything you
# don't want to change. In practice only library.media_dirs needs setting.

[server]
host = 0.0.0.0
port = 8096
# Set this if Lumen sits behind a reverse proxy or you want the stream URLs
# handed to VLC/Kodi to use a specific hostname. Leave blank to derive it
# from the request.
public_url =

[paths]
database = /var/lib/lumen/lumen.db
cache = /var/cache/lumen

[library]
# One directory per line (indented), or a comma-separated list.
media_dirs =
    /srv/media/movies
    /srv/media/tv

# Seconds between automatic rescans. 0 disables the timer; the Rescan button
# in the UI always works.
scan_interval = 900
scan_on_start = true

# Only files with these extensions are indexed.
extensions = .mp4, .m4v, .mkv, .webm, .avi, .mov, .mpg, .mpeg, .ts, .m2ts, .wmv, .flv

[transcode]
# Turn this off on a NAS with no spare CPU. Files the browser cannot decode
# then simply won't play — everything else still direct-plays.
enabled = true

ffmpeg = ffmpeg
ffprobe = ffprobe

# x264 quality/speed. Lower crf = better quality and bigger output.
# veryfast is the right preset for real-time transcoding on modest hardware.
crf = 23
preset = veryfast

# Downscale anything taller than this when re-encoding. Sources at or below
# it keep their original resolution.
max_height = 1080

# Kill a transcode whose output nothing has read for this many seconds.
# This catches a client that vanished without closing the connection; a
# long pause is also reaped, and pressing play restarts it where it was.
idle_timeout = 900

# Concurrent ffmpeg processes. Each one can saturate several cores.
max_sessions = 4

[auth]
# How long a browser stays signed in.
session_days = 30

# Lifetime of the signed URLs handed to external players (VLC, Kodi).
stream_token_seconds = 86400
